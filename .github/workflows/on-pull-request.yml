name: 'PR'
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  on-pr:
    environment: test
    env:
      PORT: 4000
      DATABASE_URL: postgresql://admin:pass@localhost:5432/chatter?schema=public
      STORAGE_BUCKET_NAME: local-chatter-storage
      AWS_S3_ENDPOINT: http://localhost:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      TOKEN_SECRET: +B*8nUZLkhdI7cBK+wt.St>3UF=k|5uo5{P@Q=&=VVmnTYCl;A(vwh/)h}!.J8pP
      FRONTEND_ENDPOINTS: http://localhost:5173

    runs-on: 'ubuntu-latest'
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: chatter
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      localstack:
        image: localstack/localstack
        ports:
          - 4566:4566
        env:
          SERVICES: s3
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Seed S3 bucket
        run: |
          aws --endpoint-url=http://localhost:4566 s3 mb s3://local-chatter-storage
          aws --endpoint-url=http://localhost:4566 s3 sync ./localstack/content s3://local-chatter-storage/

      - name: Check Lint
        run: npm run check-lint

      - name: Generate TS Types from OpenAPI Schema
        run: npm run gen-openapi-ts

      - name: Run Tests and Code Coverage
        run: npm test
